name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  JAVA_VERSION: "21"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-read-only: true
          gradle-home-cache-excludes: |
            caches/modules-2/files-2.1/com.jetbrains.intellij.rider
            caches/*/transforms
      - name: Run tests
        run: ./gradlew test

  package:
    name: Package plugin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-home-cache-excludes: |
            caches/modules-2/files-2.1/com.jetbrains.intellij.rider
            caches/*/transforms
      - name: Build plugin ZIP
        run: ./gradlew buildPlugin
      - name: Upload plugin ZIP
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rider-reference-switcher
          path: build/distributions/*.zip
          if-no-files-found: error

  verify:
    name: Verify Rider ${{ matrix.rider }}
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        rider:
          - "2025.1.7"
          - "2025.2.6.1"
          - "2025.3.5"
          - "2026.1.5"
          - "2026.2.0.2"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-read-only: true
          gradle-home-cache-excludes: |
            caches/modules-2/files-2.1/com.jetbrains.intellij.rider
            caches/*/transforms
      - name: Download plugin ZIP
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: rider-reference-switcher
          path: build/distributions
      - name: Verify plugin compatibility
        run: ./gradlew verifyPlugin -PverifierRiderVersion=${{ matrix.rider }}

  required:
    name: Build required
    if: ${{ always() }}
    needs: [test, package, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all build jobs
        env:
          TEST_RESULT: ${{ needs.test.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          test "$TEST_RESULT" = "success"
          test "$PACKAGE_RESULT" = "success"
          test "$VERIFY_RESULT" = "success"
