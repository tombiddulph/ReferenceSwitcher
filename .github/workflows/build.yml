name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  JAVA_VERSION: "21"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
          gradle-home-cache-excludes: |
            caches/modules-2/files-2.1/com.jetbrains.intellij.rider
            caches/*/transforms
      - name: Run tests
        run: ./gradlew test

  package:
    name: Package plugin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-excludes: |
            caches/modules-2/files-2.1/com.jetbrains.intellij.rider
            caches/*/transforms
      - name: Build plugin ZIP
        run: ./gradlew buildPlugin
      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v7
        with:
          name: rider-reference-switcher
          path: build/distributions/*.zip
          if-no-files-found: error

  verify:
    name: Verify Rider ${{ matrix.rider }}
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        rider:
          - "2025.1.7"
          - "2025.2.6.1"
          - "2025.3.5"
          - "2026.1.5"
          - "2026.2.0.2"
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
          gradle-home-cache-excludes: |
            caches/modules-2/files-2.1/com.jetbrains.intellij.rider
            caches/*/transforms
      - name: Download plugin ZIP
        uses: actions/download-artifact@v8
        with:
          name: rider-reference-switcher
          path: build/distributions
      - name: Verify plugin compatibility
        run: ./gradlew verifyPlugin -PverifierRiderVersion=${{ matrix.rider }}
